# Builds the NetBSD games (and the screen pieces rain and worms) for the
# Asciiverse catalog: every title with a list
# in asciiverse/archive/ is its own catalog title, so each gets its own
# archive per target, named <id>-<target>.tar.gz, plus one SHA256SUMS file
# for all of them, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github"). Runs on a pushed release tag, or by hand for
# an existing one. NetBSD's src/games has no version of its own, so a tag
# is 0, the date of the imported NetBSD commit, then ours:
# 0+20261013-av.1 (see PATCHES.md).
#
# Linux builds run in Alpine and link ncurses statically, so the binaries
# carry the -musl triple that av looks for first and need no libncurses on
# the player's machine. macOS links the system ncurses, which every Mac
# has (hack, larn and warp draw through its terminfo); the compiler
# carries -arch, so HOST_CC builds hack's makedefs, which runs during the
# build, for the runner itself. No Windows build:
# the games lean on POSIX terminals, signals and, for hunt, BSD sockets.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base ncurses-dev ncurses-static git &&
            git config --global --add safe.directory /src &&
            LIBS=-lncursesw LDFLAGS=-static asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/hack

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build and package
        run: |
          CC="cc -arch ${{ matrix.arch }}" HOST_CC=cc LIBS=-lncurses CFLAGS=-O2 asciiverse/build.sh
          file out/hack
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "NetBSD games $TAG" \
                 --notes "backgammon (with teachgammon), canfield, cgram, hack, hunt, larn, phantasia, rogue and warp, and the screen pieces rain and worms, $TAG, from NetBSD's src/games, built for the Asciiverse catalog: one archive per game and target."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
